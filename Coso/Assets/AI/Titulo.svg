<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
  <defs>
    <style>
      .titulo {
        font-family: 'Arial Black', 'Impact', sans-serif;
        font-weight: 900;
        font-size: 180px;
        text-anchor: middle;
        letter-spacing: 2px;
      }
      .sombra {
        fill: #5a3d29; /* Color marrón de la tierra */
      }
      .principal {
        fill: #e34c4c; /* Color rojo del personaje */
      }
    </style>
  </defs>

  <!-- Sombra del texto -->
  <text x="406" y="176" class="titulo sombra">Coso</text>
  
  <!-- Texto principal -->
  <text x="400" y="170" class="titulo principal">Coso</text>
</svg>