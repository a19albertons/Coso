name: Pruebas Unity y compilación

on:
    push:
        branches: [main]
        tags:
            - 'v*'
    pull_request:
        branches: [main]
        paths-ignore: ['**.md']

# Variables de entorno
env:
    # Email y contraseña
    UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
    UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    # Licencia de Unity (fichero)
    UNITY_LICENSE: ${{ secrets.UNITY_LICENSE}}
    PROJECT_PATH: ${{ vars.PROJECT_PATH }}

jobs:
    # tarea de tests
    test:
        name: test unity
        runs-on: ubuntu-24.04
        permissions:
          contents: read
          checks: write
        steps:
            # Configura checkout
            - uses: actions/checkout@v7

            # Gestiona la cache de Unity
            - name: Cache de Unity
              uses: actions/cache@v6
              with:
                path: ${{ env.PROJECT_PATH }}/Library
                key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
                restore-keys: |
                  Library-test-
                    
            # Ejecuta los tests de Unity
            - name: Ejecutar tests de Unity
              uses: game-ci/unity-test-runner@v4
              id: testRunner
              with:
                githubToken: ${{ secrets.GITHUB_TOKEN }}
                projectPath: ${{ env.PROJECT_PATH }}
            
            # Subir los resultados de los tests como artefacto
            - name: Subir resultados de tests
              uses: actions/upload-artifact@v7
              with:
                name: TestResults
                path: ${{ steps.testRunner.outputs.artifactsPath }}

    # tarea de compilación
    build:
        uses: ./.github/workflows/reusar_compilacion.yml


    # tarea de despliegue
    deploy:
        name: Despliegue en github
        needs: build
        runs-on: ubuntu-24.04
        permissions:
          contents: write
        if: startsWith(github.ref, 'refs/tags/v')
        steps:
            # Configura checkout
            - uses: actions/checkout@v7

            # Descarga los artefactos de compilación
            - name: Descargar artefactos de compilacion
              uses: actions/download-artifact@v8
              with:
                path: all-builds

            # comprimir cada build en un zip
            - name: Comprimir builds en zip
              run: |
                mkdir zip-builds
                cd all-builds
                for dir in Build-*; do
                  if [ -d "$dir" ]; then
                    echo "Comprimiendo $dir"
                    zip -r "../zip-builds/${dir}.zip" "$dir"
                  fi
                done

            # Subir los zips a la release de github
            - name: crear release y subir zips
              uses: softprops/action-gh-release@v3
              with:
                #  Filtramos por todos los ficheros que acaban en .zip dentro de zip-builds
                files: zip-builds/*.zip
                body_path: cambios.md
                name: ${{ github.event.repository.name }} ${{ github.ref_name }}
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
