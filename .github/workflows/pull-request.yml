name: Pull Request CI

on:
  pull_request:
    paths-ignore: ["**.md"]

jobs:
  test:
    uses: ./.github/workflows/reusar_test.yml
    secrets: inherit
    permissions:
      contents: read
      checks: write

  build:
    uses: ./.github/workflows/reusar_compilacion.yml
    needs: test
    secrets: inherit

  comment:
    name: Comentar PR con artefactos
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # Crear comentario en el PR con enlaces a los artefactos
      - name: Comentar PR con artefactos
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- artifact-links -->';
            const { owner, repo } = context.repo;

            // 1. Obtener los artefactos de la ejecución actual
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              }
            );

            // 2. Obtener los links de los artefactos
            const artifactLinks = artifacts.length
              ? artifacts.map(
                // Nombre del artefacto, link al artefacto (url api) y tamaño en bytes
                (a) => `- [$a.name](https://github.com/{owner}/{repo}/actions/runs/{run_id}/artifacts/{artifact_id}) (${a.size_in_bytes} bytes)`
              )
              : ['No se encontraron artefactos'];

            const commentBody = [
              MARKER,
              '## Artefactos de la build',
              ...artifactLinks,
              'Los artefactos requieren login para ser descargados y caducan después de 90 días.',
            ].join('\n');

            // 3. ¿Existe ya un comentario del bot con nuestro marcador?
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const previous = comments.find(
              (c) =>
                c.body?.includes(MARKER) &&
                (c.user?.type === 'Bot' || c.user?.login === 'github-actions[bot]')
            );

            // 4. Editar si existe, crear si no
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: commentBody,
              });
            }
